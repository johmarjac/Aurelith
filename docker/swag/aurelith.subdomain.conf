# Aurelith hinter SWAG.
#
# Ablegen unter /config/nginx/proxy-confs/aurelith.subdomain.conf und SWAG
# neu starten. Die Endung muss .conf sein — .sample wird nicht geladen.
#
# Voraussetzung: SWAG und der Spielserver hängen am selben Docker-Netz. Dafür
# liegt docker-compose.swag.yml bei. Ohne das ist `aurelith-server` für SWAG
# schlicht kein auflösbarer Name.
#
# Ein CNAME für die Unterdomain muss im DNS stehen, sonst bekommt SWAG kein
# Zertifikat dafür.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name aurelith.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app aurelith-server;
        set $upstream_port 8787;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Eine Spielverbindung steht, solange gespielt wird. nginx' Standard
        # von einer Minute zwischen zwei Lesevorgängen trennt sie mitten im
        # Spiel — der Spieler sieht einen Verbindungsabbruch ohne Ursache.
        #
        # Der Server schickt zehn Schnappschüsse je Sekunde, die Frist läuft
        # also im Normalfall nie ab. Sie greift genau dann, wenn etwas
        # klemmt, und eine Stunde ist dafür die freundlichere Grenze.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Die WebSocket-Aufwertung reicht SWAGs proxy.conf von sich aus durch
        # (Upgrade und Connection stehen dort). Fehlt sie in einer älteren
        # Fassung, kommt keine Verbindung zustande — dann hier ergänzen:
        #
        #   proxy_set_header Upgrade $http_upgrade;
        #   proxy_set_header Connection $connection_upgrade;
    }
}
