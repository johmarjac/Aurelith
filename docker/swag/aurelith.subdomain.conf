# Aurelith hinter SWAG.
#
# Ablegen unter /config/nginx/proxy-confs/aurelith.subdomain.conf und SWAG
# neu starten. Die Endung muss .conf sein — .sample wird nicht geladen.
#
# Voraussetzung: SWAG und die Aurelith-Container hängen am selben Docker-Netz.
# Dafür liegt docker-compose.swag.yml bei. Ohne das sind `aurelith-login` und
# `aurelith-kanal1` für SWAG schlicht keine auflösbaren Namen.
#
# **Drei** Unterdomains, nicht eine. Der Client verbindet sich nacheinander mit
# zwei Servern — erst mit dem Anmeldeserver, dann mit dem Kanal, den er sich
# ausgesucht hat — und jeder Kanal ist eine eigene Anwendung mit eigenem Port:
#
#   aurelith        → aurelith-login:8790    Anmeldung, Server- und Kanalliste
#   aurelith-01     → aurelith-kanal1:8787   Kanal 1
#   aurelith-02     → aurelith-kanal2:8788   Kanal 2
#
# Für **jede** dieser Unterdomains muss ein CNAME im DNS stehen, und jede muss
# in SWAGs `SUBDOMAINS=` aufgeführt sein — sonst deckt das Zertifikat sie nicht
# ab, und der Browser bricht wortlos ab. Die Namen müssen mit dem
# übereinstimmen, was in `AURELITH_KANAL1_URL` steht: das ist die Adresse, die
# der Anmeldeserver dem Client nennt.

# --- Anmeldeserver ----------------------------------------------------------
#
# Nur `/ws` nach aussen. Unter `/intern/` melden sich die Kanäle an; wer diesen
# Weg von aussen erreicht, kann einen eigenen Kanal in die Liste stellen und
# Spieler auf seinen Rechner locken. Die echten Kanäle brauchen ihn nicht von
# aussen — sie erreichen den Anmeldeserver über das interne Netz des Stapels.
#
# `/auth/<anbieter>/start`, `/auth/<anbieter>/callback` und `/anmeldearten`
# gehören dagegen dem Browser des Spielers und müssen durch — `<anbieter>` ist
# heute `google` oder `facebook`. Sie fallen unter `location /` und brauchen
# deshalb keinen eigenen Block; wer den Weg hier aber weiter einschnürt, muss
# an sie denken, sonst führen die Anbieterknöpfe ins Leere.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name aurelith.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location /intern/ {
        deny all;
        return 403;
    }

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app aurelith-login;
        set $upstream_port 8790;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# --- Kanal 1 ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name aurelith-01.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app aurelith-kanal1;
        set $upstream_port 8787;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Diese drei Zeilen sind der Unterschied zwischen „geht" und „geht
        # nicht", und ihr Fehlen sieht aus wie ein ganz anderer Fehler:
        # `/health` antwortet weiterhin brav, nur die Spielverbindung kommt
        # nicht zustande. Der Browser meldet dann `1006` — dieselbe Zahl wie
        # bei einer falschen Adresse oder einem ungültigen Zertifikat, denn
        # mehr gibt er über einen gescheiterten Handschlag nicht heraus.
        #
        # SWAGs `proxy.conf` bringt sie in neueren Fassungen selbst mit. Hier
        # stehen sie trotzdem: doppelt gesetzt schadet nicht, einmal zu wenig
        # kostet einen Abend.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Eine Spielverbindung steht, solange gespielt wird. nginx' Standard
        # von einer Minute zwischen zwei Lesevorgängen trennt sie mitten im
        # Spiel — der Spieler sieht einen Verbindungsabbruch ohne Ursache.
        #
        # Der Server schickt zehn Schnappschüsse je Sekunde, die Frist läuft
        # also im Normalfall nie ab. Sie greift genau dann, wenn etwas klemmt,
        # und eine Stunde ist dafür die freundlichere Grenze.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# --- Kanal 2 ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name aurelith-02.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app aurelith-kanal2;
        set $upstream_port 8788;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
