<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Aurelith — Modellschau</title>
    <!--
      `viewport-fit=cover` und kein Zoom: die Seite **ist** die Bedienung. Ein
      Doppeltipp, der stattdessen die Seite vergrössert, nimmt der Geste den
      Sinn — und genau das war auf dem Telefon der Unterschied zwischen
      „Modell drehen" und „Text lesen".
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="../client/icons/favicon.png" />
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <header id="kopf"></header>
    <aside id="panel"></aside>
    <button id="klapp" type="button" aria-label="Bedienfeld ein- und ausklappen">⚙</button>
    <div id="fuss"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
