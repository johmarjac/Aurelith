<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Aurelith</title>
    <!--
      Kein Skalieren, keine Adressleiste, die beim Wischen auf- und zuklappt.
      Auf dem Telefon ist das der Unterschied zwischen Spiel und Webseite.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1014" />
    <!--
      Zwei Namen für dieselbe Sache. `mobile-web-app-capable` ist der
      standardisierte, `apple-mobile-web-app-capable` der ältere — und ohne
      den zweiten startet die Seite auf älteren iOS-Fassungen trotz
      Home-Bildschirm weiter mit Adressleiste.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aurelith" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <!--
      Der Weg zum Vollbild: eine Seite darf die Browserleiste nicht selbst
      ausblenden. Legt man sie aber über „Teilen → Zum Home-Bildschirm“ ab,
      startet sie als eigenständige Anwendung — ohne Leiste, ohne Tabs.
      Manifest und Symbol sind die Voraussetzung dafür.
    -->
    <link rel="manifest" href="%BASE_URL%app.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body>
    <!--
      Die Leinwand steht vor allem anderen im Dokument und bekommt sofort ihre
      Größe. Der Blueprint verlangt „spielbar im ersten Frame" — dazu gehört,
      dass hier nichts erst nach einem Skriptlauf entsteht.
    -->
    <canvas id="viewport"></canvas>
    <div id="ui-root" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
