# Baut das Serverbild und schiebt es in die GitHub Container Registry.
#
# Zwei Architekturen: amd64 für gewöhnliche Rechner, arm64 für den Raspberry
# Pi. Beide landen unter demselben Schild — `docker pull` sucht sich die
# passende Variante selbst heraus.
#
# Der teure Teil, die Übersetzung des C++-Kerns nach WebAssembly, läuft
# dabei nur **einmal**. Das Dockerfile hängt diese Stufe an $BUILDPLATFORM,
# also an den amd64-Läufer; unter QEMU-Emulation ein zweites Mal zu
# übersetzen, ergäbe dieselbe .wasm nach vielfacher Wartezeit.
#
# Das fertige Bild liegt danach unter:
#   ghcr.io/johmarjac/aurelith-server:latest
#
# Einmalig im Repository einzustellen, falls das Paket privat bleiben soll:
#   Packages → aurelith-server → Package settings → Manage Actions access

name: Serverbild

on:
  push:
    branches:
      - main
      - claude/new-session-9cek38
    tags:
      - 'v*'
    # Nur wenn sich am Server oder am Bauplan etwas ändert. Eine Änderung am
    # Client hat auf das Serverbild keine Wirkung.
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'packages/core/**'
      - 'packages/shared/**'
      - 'packages/server/**'
      - 'assets/maps/**'
      - 'tools/build-core.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kleingeschrieben, weil die Registry Großbuchstaben im Namen ablehnt —
  # das Repository heißt "Aurelith", das Paket darf es nicht.
  IMAGE: ghcr.io/johmarjac/aurelith-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Für den arm64-Teil. Der Kern wird davon nicht berührt, aber `npm ci`
      # löst plattformabhängige Binärpakete auf und muss deshalb im Zielbild
      # laufen.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Schilder bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Emscripten-Bau ist die teuerste Schicht und ändert sich
          # selten. Ohne Cache kostet jeder Lauf ihn von vorn.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis
        run: |
          echo "Geschoben:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'

  # ---------------------------------------------------------------------------
  # Ausrollen
  # ---------------------------------------------------------------------------
  #
  # Läuft nur, wenn das Bild wirklich geschoben wurde — `needs: build` sorgt
  # dafür. Und nur vom Vorgabe-Branch oder von einem Versionsschild aus: ein
  # Zweig, an dem gerade gearbeitet wird, hat auf dem laufenden Server nichts
  # zu suchen.
  #
  # Einmalig einzurichten:
  #
  #   Settings → Secrets and variables → Actions → Secrets:
  #     PI_HOST              Adresse des Raspberry Pi
  #     PI_USER              Benutzer dort
  #     PI_SSH_KEY           privater Schlüssel (der ganze Block)
  #     PI_SSH_PASSPHRASE    falls der Schlüssel eine hat, sonst weglassen
  #     PI_PASSWORD          Alternative zum Schlüssel, falls per Passwort
  #     PI_PATH              Pfad zum Repository, sonst /home/johmarjac/aurelith
  #     TELEGRAM_BOT_TOKEN   optional, für die Benachrichtigung
  #     TELEGRAM_CHAT_ID     optional, dieselbe
  #
  # Und auf dem Pi einmalig, weil das Paket privat ist:
  #
  #   echo <token> | docker login ghcr.io -u <name> --password-stdin
  #
  # Ohne das scheitert `docker compose pull` mit „unauthorized“ — und zwar
  # jedes Mal, nicht nur beim ersten Lauf.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || startsWith(github.ref, 'refs/tags/')

    # Zwei Ausrollvorgänge gleichzeitig auf denselben Rechner ergeben keinen
    # Sinn; der laufende darf aber zu Ende gehen, damit der Server nicht
    # mitten im Neustart abgeschnitten wird.
    concurrency:
      group: deploy-pi
      cancel-in-progress: false

    env:
      # Über env statt direkt aus `secrets`, weil eine Schritt-Bedingung den
      # `secrets`-Kontext nicht lesen kann. So bleibt der Workflow grün, wenn
      # jemand ihn ohne eingerichteten Pi laufen lässt.
      PI_HOST: ${{ secrets.PI_HOST }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Auf dem Raspberry Pi aktualisieren
        if: env.PI_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          # Schlüssel *oder* Passwort — je nachdem, was hinterlegt ist. Leere
          # Felder ignoriert die Aktion, also darf hier beides stehen.
          #
          # Der Schlüssel ist die haltbarere Wahl. Nicht weil ein Passwort
          # unsicherer gespeichert wäre — beides liegt gleich geschützt als
          # Secret —, sondern weil ein Passwort **alles** aufschliesst, was
          # dieser Benutzer darf, sudo eingeschlossen. Ein Schlüssel lässt
          # sich in authorized_keys auf genau einen Befehl festnageln.
          #
          # Und: PasswordAuthentication muss in der sshd_config erlaubt sein.
          # Auf vielen Systemen ist sie inzwischen ab Werk aus.
          key: ${{ secrets.PI_SSH_KEY }}
          passphrase: ${{ secrets.PI_SSH_PASSPHRASE }}
          password: ${{ secrets.PI_PASSWORD }}
          # Ohne das läuft das Skript weiter, wenn ein Befehl scheitert, und
          # der Schritt meldet trotzdem Erfolg.
          script_stop: true
          # Erst den Quellstand holen, dann das Skript aufrufen — und dem
          # Skript sagen, dass es nicht noch einmal ziehen soll.
          #
          # Der `git pull` gehört hierher, nicht nur in `update.sh`, sonst
          # beißt sich die Katze in den Schwanz: das Skript holt den Stand,
          # in dem es selbst erst enthalten ist. Beim ersten Lauf gab es
          # genau das — „./update.sh: No such file or directory", weil auf
          # dem Pi noch der Stand von davor lag. So bringt sich das Ausrollen
          # selbst auf Stand, auch wenn sich das Skript ändert.
          script: |
            set -euo pipefail
            cd "${{ secrets.PI_PATH || '/home/johmarjac/aurelith' }}"
            git pull --ff-only
            ./update.sh --ohne-git

      - name: Telegram benachrichtigen
        # `always()`, damit auch ein Fehlschlag ankommt. Eine Nachricht, die
        # nur bei Erfolg kommt, ist keine Überwachung — dann weiß man beim
        # Ausbleiben nie, ob es schiefging oder ob niemand etwas geschoben hat.
        if: always() && env.TELEGRAM_TOKEN != ''
        env:
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = 'success' ]; then
            zeichen='✅'
            was='ausgerollt'
          else
            zeichen='❌'
            was="fehlgeschlagen ($STATUS)"
          fi

          text="$zeichen Aurelith $was
          Bild: ghcr.io/johmarjac/aurelith-server:latest
          Stand: ${GITHUB_SHA:0:7} auf ${GITHUB_REF_NAME}
          Lauf: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # --data-urlencode statt einer zusammengebauten Adresse: der Text
          # enthält Zeilenumbrüche und Doppelpunkte.
          curl -sS --fail-with-body \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT}" \
            --data-urlencode "text=${text}" \
            --data-urlencode 'disable_web_page_preview=true' \
            >/dev/null
